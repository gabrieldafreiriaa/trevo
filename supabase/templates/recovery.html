<h2>Redefinir sua senha do Trevo</h2>
<p>
  Recebemos um pedido para redefinir a sua senha. Clique no botão para escolher
  uma nova.
</p>
<p>
  <a
    href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/definir-senha"
    style="
      display: inline-block;
      padding: 12px 20px;
      border-radius: 12px;
      background: #22c55e;
      color: #04210f;
      font-weight: 600;
      text-decoration: none;
    "
  >
    Escolher nova senha
  </a>
</p>
<p style="color: #5e6a61; font-size: 13px">
  Se não foi você, ignore este e-mail. Sua senha continua a mesma.
</p>
